<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mtdrb-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MTDRB is bilingual gym management software, powered by NewMux. Members, classes, trainers, check-ins, billing and branches in one app, in English and Arabic." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="index, follow" />

    <!-- PWA: installable, standalone (no browser chrome) when added to a
         phone's home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MTDRB" />
    
    <!-- Google Fonts for English & Arabic (Cairo & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MTDRB — Your gym, in one calm app" />
    <meta property="og:description" content="Members, classes, trainers, check-ins and billing in one place, in English and Arabic. Powered by NewMux." />
    <meta property="og:image" content="/screens/og.jpg" />
    <meta property="og:image:alt" content="The MTDRB dashboard showing revenue, active members, class attendance and member satisfaction" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MTDRB — Your gym, in one calm app" />
    <meta name="twitter:description" content="Members, classes, trainers, check-ins and billing in one place, in English and Arabic. Powered by NewMux." />
    <meta name="twitter:image" content="/screens/og.jpg" />
    <meta name="twitter:image:alt" content="The MTDRB dashboard showing revenue, active members, class attendance and member satisfaction" />
    
    <title>MTDRB — Gym management, powered by NewMux</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MTDRB",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["en", "ar"],
        "description": "Bilingual gym management software for members, classes, trainers, attendance, billing, branches and analytics.",
        "creator": {
          "@type": "Organization",
          "name": "NewMux",
          "url": "https://www.newmux.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
