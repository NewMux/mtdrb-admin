<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTDRB Logo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .logo-container {
            text-align: center;
            padding: 40px;
        }
        
        .logo-text {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #0D1F85, #155FD9, #489BFA, #7BBDFE);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0;
            line-height: 1;
        }
        
        .logo-small {
            font-size: 60px;
        }
        
        .logo-medium {
            font-size: 80px;
        }
        
        .logo-variations {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        
        .size-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-variations">
            <div>
                <div class="size-label">Large (120px)</div>
                <div class="logo-text">MTDRB</div>
            </div>
            
            <div>
                <div class="size-label">Medium (80px)</div>
                <div class="logo-text logo-medium">MTDRB</div>
            </div>
            
            <div>
                <div class="size-label">Small (60px)</div>
                <div class="logo-text logo-small">MTDRB</div>
            </div>
        </div>
    </div>
</body>
</html>
