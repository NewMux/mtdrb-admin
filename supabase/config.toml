# Per-function settings for Supabase Edge Functions. This project has no
# other local Supabase CLI config (migrations/schema are applied directly to
# the hosted project per DEPLOYMENT.md's bootstrap path) -- this file exists
# only to document and enforce JWT verification per function.

[functions.paddle-webhook]
# Paddle calls this directly (not as a logged-in Supabase user) -- it
# authenticates via its own HMAC webhook signature instead (see the
# function's own isValidSignature()). Also avoids the same gotcha that
# broke the CrediMax checkout function this replaces: with verify_jwt
# true, the platform's own JWT gate can intercept a request before the
# function's code ever runs.
verify_jwt = false

[functions.paddle-cancel-subscription]
# Called from the browser. With verify_jwt on, the platform's JWT gate
# rejects the CORS preflight (which carries no Authorization header) before
# the function runs -- the same failure the old CrediMax checkout function
# hit. The function verifies the caller's JWT itself instead.
verify_jwt = false
