# Per-function settings for Supabase Edge Functions. This project has no
# other local Supabase CLI config (migrations/schema are applied directly to
# the hosted project per DEPLOYMENT.md's bootstrap path) -- this file exists
# only to document and enforce JWT verification per function.

[functions.paddle-webhook]
# Paddle calls this directly (not as a logged-in Supabase user) -- it
# authenticates via its own HMAC webhook signature instead (see the
# function's own isValidSignature()). Also avoids the same gotcha that
# broke the CrediMax checkout function this replaces: with verify_jwt
# true, the platform's own JWT gate can intercept a request before the
# function's code ever runs.
verify_jwt = false

[functions.platform-invite-gym]
# Called from the browser by a signed-in platform owner. verify_jwt stays off
# so the CORS preflight (which carries no Authorization header) reaches the
# function; the function verifies the caller's JWT itself and requires a fully
# verified platform admin (allowlist + MFA) before it does anything.
verify_jwt = false

[functions.invite-staff]
# Called from the browser by a signed-in gym admin. verify_jwt stays off so the
# CORS preflight (no Authorization header) reaches the function; the function
# verifies the caller's JWT itself and the database requires them to be an admin
# of the gym they are inviting into (staff_invite_context).
verify_jwt = false

[functions.paddle-manage-locations]
# Called from the browser by a signed-in tenant admin. verify_jwt stays off so
# the CORS preflight (no Authorization header) reaches the function; the
# function runs get_location_usage() as the caller, so Postgres verifies the
# JWT and decides who they are and whether they are their gym's admin.
verify_jwt = false

[functions.paddle-cancel-subscription]
# Called from the browser by a signed-in tenant admin. verify_jwt stays off so
# the CORS preflight (no Authorization header) reaches the function; the
# function runs get_location_usage() as the caller, so Postgres verifies the
# JWT and decides who they are and whether they are their gym's admin.
verify_jwt = false

[functions.paddle-change-plan]
# Called from the browser by a signed-in tenant admin. verify_jwt stays off so
# the CORS preflight (no Authorization header) reaches the function; the
# function runs get_location_usage() as the caller, so Postgres verifies the
# JWT and decides who they are and whether they are their gym's admin.
verify_jwt = false

[functions.delete-account]
# Called from the browser by a signed-in user erasing their own account. verify_jwt
# stays off so the CORS preflight (no Authorization header) reaches the function;
# the function verifies the caller's JWT itself with auth.getUser(token) and
# resolves their gym and role in Postgres.
verify_jwt = false

[functions.attendance-ingest]
# Called by readers, door controllers and gateways, which have no Supabase session.
# They authenticate with their own device key (hashed in the database); the function
# never trusts a gym id from the request.
verify_jwt = false
