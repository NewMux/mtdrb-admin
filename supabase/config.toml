# Per-function settings for Supabase Edge Functions. This project has no
# other local Supabase CLI config (migrations/schema are applied directly to
# the hosted project per DEPLOYMENT.md's bootstrap path) -- this file exists
# only to document and enforce JWT verification per function.

[functions.credimax-checkout]
# Was true. The platform gateway's own JWT gate intercepts/answers CORS
# preflight (OPTIONS) requests before the function's code runs when this
# is true, so the Access-Control-Allow-Methods header the function
# returns never reached the browser -- confirmed live: every checkout
# attempt logged "OPTIONS | 200" and was never followed by a POST,
# which is what supabase-js reports as "Failed to send a request to the
# Edge Function". The function already re-validates the caller's JWT in
# code (see its own auth.getUser() call), so this platform-level gate
# was redundant, not a security requirement.
verify_jwt = false

[functions.credimax-webhook]
# CrediMax calls this directly (not as a logged-in Supabase user) -- it
# authenticates via HTTP Basic Auth instead (see the function's own code).
verify_jwt = false
